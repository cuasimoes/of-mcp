name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS, not ubuntu: package.json declares "os": ["darwin"], so `npm ci`
    # fails on linux with EBADPLATFORM. Free on public repos.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate this repo was missing: esbuild strips types without checking
      # them, so nothing else here would catch a type error.
      - name: Typecheck
        run: npm run typecheck

      # Only tests/*.test.mjs — the tests/test-*.mjs harnesses run against a
      # real OmniFocus database and are deliberately not matched here.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:fast
