name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS, not ubuntu: package.json declares "os": ["darwin"], so `npm ci`
    # fails on linux with EBADPLATFORM. Free on public repos.
    runs-on: macos-latest

    # The failure mode this job exists to catch is a tsc hang/OOM. Without a
    # cap, a regression burns the 360-minute default instead of failing fast.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate this repo was missing: esbuild strips types without checking
      # them, so nothing else here would catch a type error.
      - name: Typecheck
        run: npm run typecheck

      # Only tests/*.test.mjs — the tests/test-*.mjs harnesses run against a
      # real OmniFocus database and are deliberately not matched here.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:fast

      # The unbundled emit path the tests/test-*.mjs harnesses import from.
      # Not exercised by `build`, so it would otherwise rot unnoticed.
      - name: Build (unbundled tsc emit)
        run: npm run build:tsc

      # Guards the thing that was actually broken. This runs prepublishOnly for
      # real and packs a tarball; it makes no registry call.
      - name: Publish dry run
        run: npm publish --dry-run
